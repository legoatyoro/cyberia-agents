# === CYBERIA Sentinel Gateway ===
# Genere le 2026-09-19T01:59:51.390410+00:00 — filet minimal toujours actif.
# Ce fichier est STATIQUE : ne jamais le recharger seul pendant que
# le WAF principal redemarre, sinon il devient lui-meme un trou.
# Inclusion recommandee : http { include sentinel_gateway.conf; ... }

if ($request_uri ~* "<script[\s>]") { return 403 "SENTINEL-XSS-001"; }
if ($request_uri ~* "(?i)javascript\s*:") { return 403 "SENTINEL-XSS-002"; }
if ($request_uri ~* "(?i)\bon(error|load|click)\s*=") { return 403 "SENTINEL-XSS-003"; }
if ($request_uri ~* "(?i)\bunion\s+(all\s+)?select\b") { return 403 "SENTINEL-SQLI-001"; }
if ($request_uri ~* "(?i)\bor\s+1\s*=\s*1\b") { return 403 "SENTINEL-SQLI-002"; }
if ($request_uri ~* "(?i)\bsleep\s*\(") { return 403 "SENTINEL-SQLI-003"; }
if ($request_uri ~* "\.\./\.\./|%2e%2e%2f") { return 403 "SENTINEL-LFI-001"; }
if ($request_uri ~* "(?i)etc/passwd|etc/shadow") { return 403 "SENTINEL-LFI-002"; }
if ($request_uri ~* "\$\{jndi:") { return 403 "SENTINEL-LOG4J-001"; }
if ($request_uri ~* "\{\{.*\}\}") { return 403 "SENTINEL-SSTI-001"; }
if ($request_uri ~* "(?i);\s*(cat|ls|whoami|wget|curl)\b") { return 403 "SENTINEL-RCE-001"; }
